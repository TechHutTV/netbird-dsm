name: Build SPK Release

on:
  workflow_dispatch:
    inputs:
      netbird_version:
        description: "Upstream NetBird version to package (leave blank for latest)"
        required: false
        default: ""
      build_suffix:
        description: "Build suffix for the SPK version (e.g. 1, dsm.1). Leave blank to use upstream version unchanged."
        required: false
        default: ""
      publish_release:
        description: "Create a GitHub Release with the SPK attached"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - synology_arch: x86_64
            netbird_arch: amd64
          - synology_arch: aarch64
            netbird_arch: arm64
    outputs:
      pkg: ${{ steps.ver.outputs.pkg }}
      upstream: ${{ steps.ver.outputs.upstream }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.netbird_version }}" ]; then
            upstream="${{ inputs.netbird_version }}"
          else
            upstream=$(curl -fsSL https://api.github.com/repos/netbirdio/netbird/releases/latest \
                       | jq -r '.tag_name' | sed 's/^v//')
          fi
          suffix="${{ inputs.build_suffix }}"
          if [ -n "$suffix" ]; then
            pkg="${upstream}-${suffix}"
          else
            pkg="$upstream"
          fi
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg"           >> "$GITHUB_OUTPUT"
          echo "tag=v$pkg"          >> "$GITHUB_OUTPUT"
          echo "Upstream NetBird: v$upstream"
          echo "Package version:  $pkg (${{ matrix.synology_arch }})"

      - name: Download NetBird binary (upstream version)
        run: |
          make download \
            VERSION=${{ steps.ver.outputs.upstream }} \
            SYNOLOGY_ARCH=${{ matrix.synology_arch }} \
            NETBIRD_ARCH=${{ matrix.netbird_arch }}

      - name: Build SPK (package version)
        run: |
          make package \
            VERSION=${{ steps.ver.outputs.pkg }} \
            SYNOLOGY_ARCH=${{ matrix.synology_arch }} \
            NETBIRD_ARCH=${{ matrix.netbird_arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: netbird_${{ steps.ver.outputs.pkg }}_synology_${{ matrix.netbird_arch }}
          path: netbird_${{ steps.ver.outputs.pkg }}_synology_${{ matrix.netbird_arch }}.spk
          if-no-files-found: error

  publish-release:
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all SPK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: netbird_*_synology_*
          merge-multiple: true

      - name: Publish GitHub Release (all arches)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          UPSTREAM: ${{ needs.build.outputs.upstream }}
        run: |
          set -euo pipefail
          ls -la netbird_*_synology_*.spk
          if gh release view "$TAG" >/dev/null 2>&1; then
            for f in netbird_*_synology_*.spk; do
              gh release upload "$TAG" "$f" --clobber
            done
          else
            gh release create "$TAG" \
              --title "${TAG}_synology" \
              --notes "Built from netbirdio/netbird v${UPSTREAM}" \
              netbird_*_synology_*.spk
          fi

  deploy-catalog:
    needs: [build, publish-release]
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download all SPK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: netbird_*_synology_*
          merge-multiple: true

      - name: Build _site (catalog + landing page)
        env:
          PKG_VERSION: ${{ needs.build.outputs.pkg }}
          UPSTREAM_VERSION: ${{ needs.build.outputs.upstream }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp spk/PACKAGE_ICON_256.PNG _site/icon-256.png

          # Shared metadata (same across arches)
          info=$(sh spk/INFO.sh "$PKG_VERSION" "0")
          desc=$(printf '%s\n' "$info" | sed -nE 's/^description="(.*)"$/\1/p')
          maintainer=$(printf '%s\n' "$info" | sed -nE 's/^maintainer="(.*)"$/\1/p')
          maintainer_url=$(printf '%s\n' "$info" | sed -nE 's/^maintainer_url="(.*)"$/\1/p')

          icon_url="${BASE_URL%/}/icon-256.png"
          x86_url="${BASE_URL%/}/x86_64/index.json"
          arm_url="${BASE_URL%/}/aarch64/index.json"

          # One catalog file per arch family (single-entry each). Naming the path
          # by arch family lets users pick the URL matching their NAS, avoiding
          # the ambiguity of two same-package entries in one catalog.
          for spk_file in netbird_${PKG_VERSION}_synology_*.spk; do
            netbird_arch=$(echo "$spk_file" | sed -E 's/^netbird_.*_synology_(.*)\.spk$/\1/')
            case "$netbird_arch" in
              amd64) family="x86_64" ;;
              arm64) family="aarch64" ;;
              *) echo "Unknown arch in $spk_file: $netbird_arch"; exit 1 ;;
            esac

            size=$(stat -c%s "$spk_file")
            md5=$(md5sum  "$spk_file" | awk '{print $1}')
            sha256=$(sha256sum "$spk_file" | awk '{print $1}')
            link="https://github.com/${REPO}/releases/download/${TAG}/${spk_file}"

            mkdir -p "_site/$family"
            jq -n \
              --arg version "$PKG_VERSION" \
              --arg desc "$desc" \
              --arg maintainer "$maintainer" \
              --arg maintainer_url "$maintainer_url" \
              --arg link "$link" \
              --arg icon_url "$icon_url" \
              --arg md5 "$md5" \
              --arg sha256 "$sha256" \
              --argjson size "$size" \
              '{
                packages: [{
                  package: "netbird",
                  version: $version,
                  dname: "NetBird",
                  desc: $desc,
                  maintainer: $maintainer,
                  maintainer_url: $maintainer_url,
                  distributor: $maintainer,
                  distributor_url: $maintainer_url,
                  thumbnail: [$icon_url],
                  link: $link,
                  md5: $md5,
                  sha256: $sha256,
                  size: $size,
                  qinst: true,
                  qstart: true,
                  qupgrade: true,
                  start: true,
                  thirdparty: true,
                  beta: false
                }]
              }' > "_site/$family/index.json"
          done

          cat > _site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>NetBird DSM Package Source</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.55; color: #1f2328; }
            h1 { display: flex; align-items: center; gap: 0.75rem; font-size: 1.6rem; }
            h1 img { width: 48px; height: 48px; }
            h2 { font-size: 1.05rem; margin-top: 2rem; }
            h3 { font-size: 0.95rem; margin: 1rem 0 0.4rem; color: #1f2328; }
            code, pre { background: #f6f8fa; border-radius: 6px; }
            code { padding: 0.1rem 0.3rem; font-size: 0.9em; }
            pre { padding: 0.6rem 0.8rem; overflow-x: auto; font-size: 0.85rem; }
            .url-box input { width: 100%; padding: 0.55rem 0.75rem; font-family: ui-monospace, monospace; font-size: 0.9rem; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; }
            ol li { margin: 0.35rem 0; }
            ul li { margin: 0.2rem 0; }
            hr { border: 0; border-top: 1px solid #d0d7de; margin: 2rem 0; }
            footer { font-size: 0.85rem; color: #6e7781; }
            details { margin-top: 0.75rem; }
            summary { cursor: pointer; color: #0969da; font-size: 0.9rem; }
          </style>
          </head>
          <body>
          <h1><img src="icon-256.png" alt="">NetBird DSM Package Source</h1>
          <p>Synology DSM 7.0+ package source for the <a href="https://netbird.io">NetBird</a> client. Add the URL matching your NAS architecture in <strong>Package Center &rarr; Settings &rarr; Package Sources</strong> to receive automatic updates.</p>

          <h2>Package Source URLs</h2>

          <h3>x86_64 (Intel / AMD)</h3>
          <p>Models with Intel Celeron, Xeon, or AMD Ryzen CPUs &mdash; e.g. DS918+, DS920+, DS923+, DS1522+, RS series.</p>
          <div class="url-box"><input type="text" value="$x86_url" readonly onclick="this.select()"></div>

          <h3>aarch64 (64-bit ARM)</h3>
          <p>Models with Realtek RTD or Marvell Armada ARM CPUs &mdash; e.g. DS220j, DS223j, DS124, DS418j.</p>
          <div class="url-box"><input type="text" value="$arm_url" readonly onclick="this.select()"></div>

          <details>
          <summary>Not sure which architecture? Run this on your NAS via SSH</summary>
          <pre>synogetkeyvalue /etc.defaults/synoinfo.conf unique</pre>
          <p>Output looks like <code>synology_&lt;arch&gt;_&lt;model&gt;</code>. The middle token tells you which URL to use:</p>
          <ul>
            <li><strong>x86_64 URL</strong> if you see <code>apollolake</code>, <code>geminilake</code>, <code>v1000</code>, <code>r1000</code>, <code>denverton</code>, <code>broadwell*</code>, <code>purley</code>, <code>epyc7002</code>, etc.</li>
            <li><strong>aarch64 URL</strong> if you see <code>armada37xx</code>, <code>rtd1296</code>, <code>rtd1619b</code>.</li>
          </ul>
          </details>

          <h2>Setup</h2>
          <ol>
            <li>Open <strong>Package Center</strong> on your Synology DSM.</li>
            <li>Open <strong>Settings &rarr; Package Sources</strong>, click <strong>Add</strong>, give it any name, and paste the URL for your arch as the Location.</li>
            <li>Open <strong>Settings &rarr; General</strong> and set <strong>Trust Level</strong> to <strong>Any publisher</strong>.</li>
            <li>NetBird will appear under the <strong>Community</strong> tab in Package Center.</li>
          </ol>

          <h2>Uninstall</h2>
          <p>Stop the package before uninstalling &mdash; DSM can leave the package in a stuck state if the daemon is still running (or has crashed) at the time of removal.</p>
          <ol>
            <li>In <strong>Package Center</strong>, open <strong>NetBird &rarr; Action &rarr; Stop</strong> (or run <code>sudo synopkg stop netbird</code> via SSH).</li>
            <li>Then click <strong>Action &rarr; Uninstall</strong>.</li>
          </ol>

          <h2>Latest Version</h2>
          <p><strong>v$PKG_VERSION</strong> &mdash; built from <a href="https://github.com/netbirdio/netbird/releases/tag/v$UPSTREAM_VERSION">netbird v$UPSTREAM_VERSION</a>.<br>
          <a href="https://github.com/$REPO/releases">All releases</a></p>

          <hr>
          <footer>Source: <a href="https://github.com/$REPO">github.com/$REPO</a></footer>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
