name: Build SPK Release

on:
  workflow_dispatch:
    inputs:
      netbird_version:
        description: "Upstream NetBird version to package (leave blank for latest)"
        required: false
        default: ""
      build_suffix:
        description: "Build suffix for the SPK version (e.g. 1, dsm.1). Leave blank to use upstream version unchanged."
        required: false
        default: ""
      publish_release:
        description: "Create a GitHub Release with the SPK attached"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.ver.outputs.pkg }}
      upstream: ${{ steps.ver.outputs.upstream }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.netbird_version }}" ]; then
            upstream="${{ inputs.netbird_version }}"
          else
            upstream=$(curl -fsSL https://api.github.com/repos/netbirdio/netbird/releases/latest \
                       | jq -r '.tag_name' | sed 's/^v//')
          fi
          suffix="${{ inputs.build_suffix }}"
          if [ -n "$suffix" ]; then
            pkg="${upstream}-${suffix}"
          else
            pkg="$upstream"
          fi
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg"           >> "$GITHUB_OUTPUT"
          echo "tag=v$pkg"          >> "$GITHUB_OUTPUT"
          echo "Upstream NetBird: v$upstream"
          echo "Package version:  $pkg"

      - name: Download NetBird binary (upstream version)
        run: |
          echo "${{ steps.ver.outputs.upstream }}" > VERSION
          make download

      - name: Build SPK (package version)
        run: make package VERSION=${{ steps.ver.outputs.pkg }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netbird_${{ steps.ver.outputs.pkg }}_synology_amd64
          path: netbird_${{ steps.ver.outputs.pkg }}_synology_amd64.spk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          file="netbird_${{ steps.ver.outputs.pkg }}_synology_amd64.spk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" \
              --title "${tag}_synology" \
              --notes "Built from netbirdio/netbird v${{ steps.ver.outputs.upstream }}" \
              "$file"
          fi

  deploy-catalog:
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download SPK artifact
        uses: actions/download-artifact@v4
        with:
          name: netbird_${{ needs.build.outputs.pkg }}_synology_amd64

      - name: Build _site (catalog + landing page)
        env:
          PKG_VERSION: ${{ needs.build.outputs.pkg }}
          UPSTREAM_VERSION: ${{ needs.build.outputs.upstream }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp spk/PACKAGE_ICON_256.PNG _site/icon-256.png

          spk_file="netbird_${PKG_VERSION}_synology_amd64.spk"
          size=$(stat -c%s "$spk_file")
          md5=$(md5sum  "$spk_file" | awk '{print $1}')
          sha256=$(sha256sum "$spk_file" | awk '{print $1}')

          info=$(sh spk/INFO.sh "$PKG_VERSION" "0")
          desc=$(printf '%s\n' "$info" | sed -nE 's/^description="(.*)"$/\1/p')
          maintainer=$(printf '%s\n' "$info" | sed -nE 's/^maintainer="(.*)"$/\1/p')
          maintainer_url=$(printf '%s\n' "$info" | sed -nE 's/^maintainer_url="(.*)"$/\1/p')

          link="https://github.com/${REPO}/releases/download/${TAG}/${spk_file}"
          icon_url="${BASE_URL%/}/icon-256.png"
          source_url="${BASE_URL%/}/index.json"

          jq -n \
            --arg version "$PKG_VERSION" \
            --arg desc "$desc" \
            --arg maintainer "$maintainer" \
            --arg maintainer_url "$maintainer_url" \
            --arg link "$link" \
            --arg icon_url "$icon_url" \
            --arg md5 "$md5" \
            --arg sha256 "$sha256" \
            --argjson size "$size" \
            '{
              packages: [{
                package: "netbird",
                version: $version,
                dname: "NetBird",
                desc: $desc,
                maintainer: $maintainer,
                maintainer_url: $maintainer_url,
                distributor: $maintainer,
                distributor_url: $maintainer_url,
                thumbnail: [$icon_url],
                link: $link,
                md5: $md5,
                sha256: $sha256,
                size: $size,
                qinst: true,
                qstart: true,
                qupgrade: true,
                start: true,
                thirdparty: true,
                beta: false
              }]
            }' > _site/index.json

          cat > _site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>NetBird DSM Package Source</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.55; color: #1f2328; }
            h1 { display: flex; align-items: center; gap: 0.75rem; font-size: 1.6rem; }
            h1 img { width: 48px; height: 48px; }
            h2 { font-size: 1.05rem; margin-top: 2rem; }
            code { background: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 6px; font-size: 0.9em; }
            .url-box input { width: 100%; padding: 0.55rem 0.75rem; font-family: ui-monospace, monospace; font-size: 0.9rem; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; }
            ol li { margin: 0.35rem 0; }
            hr { border: 0; border-top: 1px solid #d0d7de; margin: 2rem 0; }
            footer { font-size: 0.85rem; color: #6e7781; }
          </style>
          </head>
          <body>
          <h1><img src="icon-256.png" alt="">NetBird DSM Package Source</h1>
          <p>Synology DSM 7.0+ package source for the <a href="https://netbird.io">NetBird</a> client. Add the URL below in <strong>Package Center &rarr; Settings &rarr; Package Sources</strong> to receive automatic updates.</p>

          <h2>Package Source URL</h2>
          <div class="url-box"><input type="text" value="$source_url" readonly onclick="this.select()"></div>

          <h2>Setup</h2>
          <ol>
            <li>Open <strong>Package Center</strong> on your Synology DSM.</li>
            <li>Open <strong>Settings &rarr; Package Sources</strong>, click <strong>Add</strong>, give it any name, and paste the URL above as the Location.</li>
            <li>Open <strong>Settings &rarr; General</strong> and set <strong>Trust Level</strong> to <strong>Any publisher</strong>.</li>
            <li>NetBird will appear under the <strong>Community</strong> tab in Package Center.</li>
          </ol>

          <h2>Latest Version</h2>
          <p><strong>v$PKG_VERSION</strong> &mdash; built from <a href="https://github.com/netbirdio/netbird/releases/tag/v$UPSTREAM_VERSION">netbird v$UPSTREAM_VERSION</a>.<br>
          <a href="$link">Direct SPK download</a> &middot; <a href="https://github.com/$REPO/releases">All releases</a></p>

          <hr>
          <footer>Source: <a href="https://github.com/$REPO">github.com/$REPO</a></footer>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
